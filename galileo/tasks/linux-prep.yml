---
- name: Create Galileo Group
  ansible.builtin.group:
    name: galileo
    state: present
    gid: "{{ galileo_gid | default(omit) }}"

- name: Create Galileo User
  ansible.builtin.user:
    name: galileo
    uid: "{{ galileo_uid | default(omit) }}"
    home: /opt/galileo
    group: galileo
    create_home: false

- name: If necessary, add galileo to /etc/cron.allow
  ansible.builtin.lineinfile:
    path: /etc/cron.allow
    line: galileo
    state: present
