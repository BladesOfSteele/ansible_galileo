---
- name: Download OS agent install file from Galileo
  ansible.builtin.get_url:
    url: https://my.galileosuite.com/downloads/{{ agent_package }}
    dest: /tmp
    mode: "0644"
  vars:
    ansible_python_interpreter: /usr/bin/python3
  connection: local
  #  run_once: true

- name: Copy file to remote server
  ansible.builtin.copy:
    src: /tmp/{{ agent_package }}
    dest: /tmp
    mode: "0644"

# - name: Check if RPM is already installed
#   ansible.builtin.shell: |
#     set -o pipefail
#     rpm  -q {{ (agent_package.split('.') | map('trim'))[:2] | join('.') }}
#   changed_when: false
#   failed_when: false
#   register: rpm_is_installed

- name: Install {{ agent_package }}
  ansible.builtin.shell: |
    set -o pipefail
    rpm -Uvh /tmp/{{ agent_package }}
  # when: rpm_is_installed.rc != 0
  register: rpm_result
  failed_when: rpm_result.rc != 0 and 'already installed' not in rpm_result.stderr
  changed_when: "'already installed' not in rpm_result.stderr"
